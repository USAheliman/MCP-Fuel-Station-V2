; MCP Fuel Station V2
; ESP32-S3 DevKitC-1 N16R8 — single board replaces Teensy41 + ESP32
; ─────────────────────────────────────────────────────────────────────

[env:esp32-s3-devkitc-1]
platform                  = espressif32
board                     = esp32-s3-devkitc-1
framework                 = arduino

; ── Flash / PSRAM ────────────────────────────────────────────────────
board_build.flash_size         = 16MB
board_build.flash_mode         = qio
board_build.flash_freq         = 80m
board_build.arduino.memory_type = qio_opi
board_build.partitions         = partitions_16mb.csv
board_upload.flash_size        = 16MB
board_build.filesystem           = littlefs
data_dir                  = data

; ── Upload ───────────────────────────────────────────────────────────
upload_port               = COM8
upload_speed              = 921600
upload_resetmethod        = nodemcu
extra_scripts             = post:clear_otadata.py
monitor_speed             = 115200
build_flags =
    -DFW_VERSION=\"v2.7.9\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include
    ; TFT_eSPI — ILI9341 2.8" 240x320  (USE_FSPI_PORT fixes IDF5/ESP32-S3 register index)
    -DUSE_FSPI_PORT=1
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=12
    -DTFT_SCLK=11
    -DTFT_CS=13
    -DTFT_DC=14
    -DTFT_RST=15
    -DTFT_BL=48
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=20000000

; ── Libraries ────────────────────────────────────────────────────────
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.0.8
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1
    madhephaestus/ESP32Encoder @ ^0.10.1
    adafruit/RTClib @ ^2.1.4

; ── OTA (wireless) upload environment ────────────────────────────────
[env:esp32-s3-ota]
extends           = env:esp32-s3-devkitc-1
upload_protocol   = custom
upload_port       = fuelstation.local
extra_scripts     = upload_ota.py

